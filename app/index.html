   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2

                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }

      }

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

        var data = dataList[i];

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);

      // calc num max data.

      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;

      if (buffer.getLengthInBits() > totalDataCount * 8) {

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

          qrHtml += '"/>';

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +

      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +

      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;

          }

      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];

        var c = s.charCodeAt(i);

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

.list{padding:6px 16px 16px;}

.catlabel:first-child{margin-top:4px;}
.row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.row .img{width:84px;height:84px;border-radius:14px;background-size:cover;background-position:center;flex:none;}
.row .info{flex:1;min-width:0;}
.row .nm{font-weight:700;font-size:14.5px;}
.row .ds{font-size:11.5px;color:var(--ink-soft);margin:3px 0 6px;line-height:1.35;}
.row .pr{font-family:var(--serif);font-weight:800;color:var(--orange-deep);font-size:17px;}
.row .ctr{display:flex;align-items:center;gap:0;margin-top:auto;}
.stepper{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--orange);border-radius:11px;}
.stepper button{width:30px;height:30px;border:none;background:none;color:var(--orange);font-size:18px;font-weight:700;cursor:pointer;}
.stepper b{font-family:var(--serif);min-width:16px;text-align:center;font-size:15px;}
.addbtn{background:var(--orange);color:#fff;border:none;border-radius:11px;width:34px;height:34px;font-size:22px;line-height:1;cursor:pointer;}
.rowfoot{display:flex;align-items:flex-end;justify-content:space-between;}

/* ===== CART BAR ===== */
.cartbar{position:absolute;left:14px;right:14px;bottom:72px;background:var(--ink);color:#fff;
  border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);
  transform:translateY(120px);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:25;cursor:pointer;}
.cartbar.show{transform:none;}
.cartbar .cnt{background:var(--orange);width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-family:var(--serif);}
.cartbar .t{flex:1;font-size:12px;opacity:.7;}
.cartbar .tot{font-family:var(--serif);font-weight:800;font-size:17px;}

/* ===== SHEET (cart/checkout/onboarding) ===== */
.scrim{position:absolute;inset:0;background:rgba(20,13,9,.55);opacity:0;pointer-events:none;
  transition:opacity .3s;z-index:40;}
.scrim.show{opacity:1;pointer-events:auto;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-radius:26px 26px 0 0;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.85,.25,1);z-index:41;
  max-height:88%;display:flex;flex-direction:column;}
.sheet.show{transform:none;}
.sheet .grab{width:40px;height:4px;background:#D9CBBC;border-radius:4px;margin:10px auto 4px;}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;border-bottom:1px solid var(--line);}
.sheet .shead h3{font-family:var(--serif);font-weight:800;font-size:19px;margin:0;}
.sheet .shead .x{border:none;background:#fff;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink-soft);}
.sheet .sbody{overflow-y:auto;padding:14px 18px;flex:1;}
.sheet .sfoot{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;}

.citem{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);}
.citem .img{width:52px;height:52px;border-radius:12px;background-size:cover;background-position:center;flex:none;}
.citem .nm{font-weight:700;font-size:13.5px;}
.citem .pr{font-size:12px;color:var(--ink-soft);}

.optrow{display:flex;gap:8px;margin:4px 0 14px;}
.opt{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;text-align:center;
  cursor:pointer;font-family:inherit;}
.opt.on{border-color:var(--orange);background:#FFF1E9;}
.opt .em{font-size:20px;}
.opt .t{font-size:11.5px;font-weight:600;margin-top:4px;}

.field{margin-bottom:12px;}
.field label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;}
.field input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:14px;background:#fff;}
.field input:focus{outline:none;border-color:var(--orange);}

.sumrow{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;}
.sumrow.tot{font-family:var(--serif);font-weight:800;font-size:19px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;}
.earn{background:#FFF7E8;border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;display:flex;
  align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#8a6a16;margin:10px 0;}

/* ===== LOYALTY ===== */
.member{margin:14px;border-radius:24px;padding:20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#2a1d15 0%,var(--maroon) 120%);box-shadow:var(--shadow);}
.member::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,var(--orange) 0%,transparent 70%);opacity:.5;}
.member .top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;}
.member .rank{font-size:11px;font-weight:700;background:rgba(244,183,64,.22);color:var(--gold);padding:4px 10px;border-radius:20px;}
.member .who{font-weight:700;font-size:15px;margin-top:14px;}
.member .sub{font-size:11px;opacity:.6;}
.member .ptbig{font-family:var(--serif);font-weight:800;font-size:46px;line-height:1;color:var(--gold);margin-top:10px;}
.member .ptlbl{font-size:11px;opacity:.7;margin-top:2px;}

.progwrap{margin:14px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;}
.progwrap .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.progwrap .ph b{font-family:var(--serif);font-size:16px;}
.bar{height:12px;background:var(--cream);border-radius:8px;overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:8px;transition:width .6s;}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px;}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;
  justify-content:center;font-size:18px;color:#D9CBBC;}
.stamp.fill{border:none;background:var(--orange);color:#fff;}

.reward{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:12px;margin:10px 16px;}
.reward .ic{width:46px;height:46px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;}
.reward .nm{font-weight:700;font-size:14px;}
.reward .co{font-size:12px;color:var(--gold);font-weight:700;}
.reward .rb{margin-left:auto;border:none;background:var(--orange);color:#fff;font-weight:700;font-family:inherit;
  font-size:12px;padding:8px 12px;border-radius:10px;cursor:pointer;}
.reward .rb:disabled{background:#EDE2D4;color:#A99B8D;}

.histitem{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);}
.histitem .ic{width:36px;height:36px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;}
.histitem .d{font-size:11px;color:var(--ink-soft);}
.histitem .pt{margin-left:auto;font-family:var(--serif);font-weight:800;}
.histitem .pt.plus{color:var(--green);}
.histitem .pt.minus{color:var(--orange-deep);}

/* ===== ONBOARDING / OA LINK ===== */
.onb{position:absolute;inset:0;z-index:60;background:linear-gradient(160deg,var(--orange) 0%,var(--orange-deep) 65%,#a52e08 100%);
  color:#fff;display:flex;flex-direction:column;padding:40px 26px calc(26px + env(safe-area-inset-bottom));
  transition:opacity .4s,transform .4s;}
.onb.hide{opacity:0;transform:translateY(-20px);pointer-events:none;}
.onb .logo{width:84px;height:84px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:800;color:var(--orange);font-size:40px;margin-bottom:auto;box-shadow:0 12px 30px rgba(0,0,0,.25);}
.onb h1{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.1;margin:0 0 8px;}
.onb p{font-size:14px;opacity:.92;line-height:1.5;margin:0 0 22px;}
.onb .feat{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:13.5px;font-weight:600;}
.onb .feat .e{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
.onb .oalink{background:#fff;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;margin:20px 0 14px;color:var(--ink);}
.onb .oalink .av{width:44px;height:44px;border-radius:12px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;color:#fff;font-size:22px;}
.onb .oalink .nm{font-weight:800;font-size:14px;}
.onb .oalink .sb{font-size:11px;color:var(--ink-soft);}
.onb .oalink .ck{margin-left:auto;color:var(--green);font-size:22px;}
.btn-white{background:#fff;color:var(--orange-deep);}
.onb .skip{background:none;border:none;color:rgba(255,255,255,.85);font-family:inherit;font-weight:600;
  font-size:13px;margin-top:12px;cursor:pointer;text-decoration:underline;}

/* ===== TOAST ===== */
.toast{position:absolute;left:50%;bottom:80px;transform:translate(-50%,40px);background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:80;opacity:0;
  transition:all .3s;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;white-space:nowrap;max-width:90%;}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* success overlay */
.success{position:absolute;inset:0;z-index:55;background:var(--cream);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:30px;opacity:0;pointer-events:none;transition:opacity .35s;}
.success.show{opacity:1;pointer-events:auto;}
.success .circ{width:96px;height:96px;border-radius:50%;background:var(--green);display:flex;align-items:center;
  justify-content:center;font-size:50px;color:#fff;margin-bottom:20px;animation:pop .5s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}
.success h2{font-family:var(--serif);font-weight:800;font-size:26px;margin:0 0 6px;}
.success p{color:var(--ink-soft);font-size:14px;margin:0 0 4px;}
.success .ptwon{margin:18px 0;background:#FFF7E8;border:1px dashed var(--gold);border-radius:16px;padding:14px 24px;}
.success .ptwon b{font-family:var(--serif);font-size:30px;color:var(--gold);}
.oa-msg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;
  text-align:left;max-width:300px;margin-bottom:20px;}
.oa-msg .av{width:34px;height:34px;border-radius:10px;background:var(--orange);flex:none;display:flex;
  align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;color:#fff;}
.oa-msg .tx{font-size:12px;line-height:1.4;}
.oa-msg .tx b{font-size:12px;}
.partrow{display:flex;flex-direction:column;gap:8px;margin:2px 0 8px;}
.part{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;cursor:pointer;}
.part.on{border-color:var(--orange);background:#FFF1E9;}
.plogo{width:36px;height:36px;border-radius:10px;color:#fff;font-family:var(--serif);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;}
.part .pn{font-weight:700;font-size:14px;}
.part .pmeta{font-size:11px;color:var(--ink-soft);}
.part .pck{margin-left:auto;color:var(--green);font-size:19px;opacity:0;}
.part.on .pck{opacity:1;}
.pnote{font-size:11.5px;color:#8a6a16;background:#FFF7E8;border:1px dashed var(--gold);border-radius:10px;padding:8px 10px;margin-bottom:10px;line-height:1.45;}
.row .pr .cust{font-size:10px;font-weight:700;color:var(--orange);background:#FFF1E9;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle;}
.addbtn{position:relative;}
.addbtn .qb{position:absolute;top:-7px;right:-7px;background:var(--ink);color:#fff;font-style:normal;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.idetail{display:flex;gap:12px;align-items:center;margin-bottom:16px;}
.idetail .iimg{width:88px;height:88px;border-radius:14px;overflow:hidden;flex:none;}
.idetail .iimg img{width:100%;height:100%;object-fit:cover;}
.idetail .inm{font-family:var(--serif);font-weight:800;font-size:18px;line-height:1.15;}
.idetail .ids{font-size:11.5px;color:var(--ink-soft);margin:3px 0 5px;}
.idetail .ipr{font-family:var(--serif);font-weight:800;color:var(--orange-deep);font-size:18px;}
.ogh{font-size:13px;font-weight:700;margin-bottom:8px;}
.ogh span{font-weight:500;color:var(--ink-soft);font-size:11px;}
.opt2{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;background:#fff;}
.opt2.on{border-color:var(--orange);background:#FFF1E9;}
.opt2 .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;position:relative;}
.opt2.on .ck{background:var(--orange);border-color:var(--orange);}
.opt2.on .ck:after{content:'✓';position:absolute;inset:0;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;}
.opt2 .on2{flex:1;font-size:13.5px;font-weight:600;}
.opt2 .op{font-size:12.5px;color:var(--ink-soft);font-weight:700;}
.iqty{display:flex;align-items:center;justify-content:space-between;}
.citem .cadd{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.upsell{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;}
.upsell .uph{font-size:13px;font-weight:700;margin-bottom:8px;}
.uprow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.uprow::-webkit-scrollbar{display:none;}
.upcard{flex:none;width:98px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;}
.upcard .upimg{height:64px;}
.upcard .upimg img{width:100%;height:100%;object-fit:cover;}
.upcard .upnm{font-size:11px;font-weight:600;padding:6px 6px 0;line-height:1.2;height:33px;overflow:hidden;}
.upcard .uppr{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 8px;font-family:var(--serif);font-weight:800;color:var(--orange-deep);font-size:13px;}
.upcard .upadd{background:var(--orange);color:#fff;width:21px;height:21px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.claimcard{margin:14px;background:#EAF1FB;border:1px solid #B7D2F2;border-radius:18px;padding:13px 14px;display:flex;align-items:center;gap:12px;}
.claimcard .cic{width:42px;height:42px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none;}
.claimcard .cbtn{border:none;background:#4285f4;color:#fff;font-family:inherit;font-weight:700;font-size:13px;padding:9px 14px;border-radius:11px;cursor:pointer;flex:none;}
.ordcard{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:12px;background:#fff;}
.ordtop{display:flex;justify-content:space-between;align-items:center;}
.ordno{font-weight:700;font-size:14px;}
.ordch{font-size:9px;font-weight:600;color:#fff;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em;margin-left:7px;}
.ordtot{font-weight:700;color:var(--orange-deep);font-size:15px;}
.ordmeta{font-size:11.5px;color:var(--ink-soft);margin:4px 0 8px;}
.orditems{font-size:12.5px;line-height:1.4;border-top:1px dashed var(--line);padding-top:8px;}
.orditems .oi{display:flex;justify-content:space-between;gap:10px;padding:2px 0;}
.orditems .oadd{color:var(--ink-soft);font-size:11px;}
.ordstatus{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;margin-top:9px;}
.ordstatus.done{background:#E7F6EE;color:var(--green);}
.ordstatus.wait{background:#FFF1E9;color:var(--orange-deep);}
.ordstatus.sent{background:#EAF1FB;color:#4285f4;}
.ordact{display:flex;gap:8px;margin-top:11px;}
.ordact button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-family:inherit;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink);}
.ordact .reord{background:var(--orange);color:#fff;border-color:var(--orange);}

/* ===== PREMIUM THEME OVERRIDES ===== */
body{background:var(--cream);}
.display,.h1,.hero h2,.sechead h3,.sheet .shead h3,.onb h1,.success h2,.catlabel,.member .ptbig,.minicard .pts,.idetail .inm{font-family:var(--serif);font-weight:700;letter-spacing:-.02em;}
.h1{font-size:21px;} .sechead h3{font-size:17px;}
.zbar .oa .av,.onb .oalink .av,.oa-msg .av,.plogo,.claimcard .cbtn{font-weight:600;}
.dish .pr,.row .pr,.idetail .ipr,.cartbar .tot,.sumrow.tot,.stepper b,.histitem .pt,.progwrap .ph b{font-weight:600;}
/* hero — dark & refined */
.hero{background:linear-gradient(145deg,#FF6E2D 0%,#FF5A1F 45%,#E8430C 100%);border:none;box-shadow:0 14px 34px rgba(232,67,12,.30);}
.hero::after{display:none;}
.hero .tag{background:transparent;padding:0;color:rgba(255,255,255,.92);font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;}
.hero h2{font-weight:700;font-size:26px;margin:11px 0 7px;letter-spacing:-.01em;}
.hero p{opacity:.92;font-size:12.5px;}
.hero .cta{background:#fff;color:var(--orange-deep);border-radius:10px;font-weight:700;padding:10px 18px;}
/* onboarding — dark & refined */
.onb{background:linear-gradient(160deg,#FF6E2D 0%,#E8430C 62%,#C2370A 100%);}
.onb h1{font-weight:700;} .onb .logo{box-shadow:0 16px 36px rgba(0,0,0,.26);}
.onb .feat .e{background:rgba(255,255,255,.18);}
.onb .feat .e svg{width:19px;height:19px;color:#fff;}
.btn-white{background:#fff;color:var(--orange-deep);font-weight:700;}
.onb .oalink{background:#fff;}
/* buttons / chips / cards radii + weights */
.btn{border-radius:11px;font-weight:600;}
.q{border-radius:14px;} .q .ic{background:#fff;border:1px solid var(--line);}
.dish{border-radius:14px;} .minicard{border-radius:16px;} .member{border-radius:18px;}
.cat{border-radius:9px;font-weight:500;} .cat.on{background:var(--ink);border-color:var(--ink);}
.hscroll .dish .img{height:104px;}
/* badges */
.dish .hot{background:rgba(20,14,10,.62);color:#fff;font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:4px 8px;}
.best{display:inline-block;font-size:8.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--orange-deep);border:1px solid var(--orange);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.row .pr .cust{background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:9px;}
/* stamps */
.stamp{border:1.5px solid var(--line);} .stamp.fill{background:var(--orange);border-color:var(--orange);}
/* dividers & shadows softer */
.minicard,.member,.hero{box-shadow:0 10px 28px rgba(0,0,0,.22);}
.reward,.progwrap,.q,.dish{box-shadow:none;}
/* ===== Tạm hết / sắp hết (Prompt 3) ===== */
.dish.soldout .img,.row.soldout .img{filter:grayscale(.85);opacity:.62;}
.dish.soldout,.row.soldout{cursor:default;}
.soldlbl{position:absolute;top:8px;left:8px;background:rgba(20,14,10,.78);color:#fff;font-size:8.5px;
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:4px 8px;}
.row .soldlbl{position:static;display:inline-block;margin-left:6px;vertical-align:middle;}
.lowlbl{display:inline-block;font-size:8.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--gold);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.addbtn[disabled],.add[disabled]{opacity:.35;pointer-events:none;}
`;
var __TPL=`

  <!-- Zalo mini-app control bar -->
  <div class="zbar">
    <div class="oa">
      <div class="av">B</div>
      <div class="nm">Bunbun Burger</div>
      <div class="vf">✓ OA</div>
    </div>
    <div class="zctrl">
      <div class="pill"><span>⌕</span><span>⋯</span></div>
      <div class="close">✕</div>
    </div>
  </div>

  <!-- ====== SCREENS ====== -->
  <div class="screen" id="screen">

/* ============================================================================
 *  NGUỒN DỮ LIỆU BACKEND (Prompt 3 / TODO #5)
 *  - Menu: GET {API_BASE}/menu  (ETag cache, stale-while-revalidate)
 *  - Tồn/hết: GET {API_BASE}/availability
 *  - Điểm: POST {API_BASE}/crm-points
 *  Khi API_BASE chưa cấu hình hoặc API lỗi → dùng MENU bundled + cache localStorage.
 * ========================================================================== */
const MENU_BUNDLED = MENU;                 // giữ bản mặc định để fallback
let AVAIL = {};                            // { itemId: 'available'|'low'|'soldout' }
let menuMeta = { version:null, updatedAt:null, source:'bundled' };
const LS = { menu:'bb_menu_cache', etag:'bb_menu_etag', avail:'bb_avail_cache' };

const API_BASE_URL = "https://vmmjvkotttbxoyforxgh.functions.supabase.co";
function apiBase(){
  const b = API_BASE_URL || (window.Zalo && window.Zalo.CONFIG && window.Zalo.CONFIG.API_BASE) || '';
  return /^https?:\/\//.test(b) ? b.replace(/\/$/,'') : '';
}
function timeHM(ts){ const d=ts?new Date(ts):new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(_){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }

/* Chuẩn hoá payload menu từ API → cấu trúc nhóm mà UI dùng */
function applyMenuPayload(j){
  if(!j || !Array.isArray(j.groups) || !j.groups.length) return false;
  MENU = j.groups;
  menuMeta = { version:j.version ?? null, updatedAt:j.updatedAt || Date.now(), source:'api' };
  return true;
}
function updateMenuStamp(){
  const el=$('#menu-updated'); if(!el) return;
  if(menuMeta.source==='bundled'){ el.textContent='thực đơn mẫu'; return; }
  el.textContent='Cập nhật lần cuối '+timeHM(menuMeta.updatedAt);
}

/* Tải menu kèm ETag. 304 → giữ cache. Lỗi mạng → fallback cache rồi bundled. */
async function fetchMenu(){
  const base=apiBase();
  if(!base){ menuMeta.source='bundled'; updateMenuStamp(); return; }
  const etag=lsGet(LS.etag);
  try{
    const res=await fetch(base+'/menu',{ headers: etag?{'If-None-Match':etag}:{} });
    if(res.status===304){
      const cached=lsGet(LS.menu);
      if(cached && applyMenuPayload(cached)){ render(); }
      updateMenuStamp(); return;
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j=await res.json();
    const tag=res.headers.get('ETag');
    if(applyMenuPayload(j)){
      lsSet(LS.menu, j); if(tag) lsSet(LS.etag, tag);
      render();
    }
  }catch(e){
    console.warn('[Bunbun] /menu lỗi → dùng cache/bundled:', e.message);
    const cached=lsGet(LS.menu);
    if(cached && applyMenuPayload(cached)){ render(); }
    else { menuMeta.source='bundled'; }
  }finally{ updateMenuStamp(); }
}

/* Tải trạng thái tồn/hết. Lỗi → giữ cache gần nhất (không chặn nhầm). */
async function fetchAvailability(){
  const base=apiBase();
  if(!base) return;
  try{
    const res=await fetch(base+'/availability');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j=await res.json();
    AVAIL=j.availability||{}; lsSet(LS.avail, AVAIL); render();
  }catch(e){
    console.warn('[Bunbun] /availability lỗi → giữ cache:', e.message);
    const cached=lsGet(LS.avail); if(cached){ AVAIL=cached; render(); }
  }
}
function availStatus(id){ return AVAIL[id]||'available'; }
function isSoldout(id){ return availStatus(id)==='soldout'; }

/* Đồng bộ điểm hội viên từ iPOS CRM qua backend (chỉ chạy trong Zalo + có API). */
async function syncMemberPoints(action='get', amount=0, orderNo){
  const base=apiBase();
  if(!base || !(window.Zalo && window.Zalo.getPhoneToken)) return; // browser/demo: giữ điểm mô phỏng
  try{
    const phoneToken=await window.Zalo.getPhoneToken();
    const accessToken=(window.Zalo.getAccessToken)?await window.Zalo.getAccessToken():'';
    const r=await fetch(base+'/crm-points',{ method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ phoneToken, accessToken, action, amount, orderNo }) }).then(x=>x.json());
    if(typeof r.points==='number') state.points=r.points;
    if(typeof r.stamps==='number') state.stamps=r.stamps;
    render();
  }catch(e){ console.warn('[Bunbun] /crm-points lỗi:', e.message); }
}

/* Mở URL ngoài đúng cách trong Zalo Mini App (window.open bị chặn).
   mode 'in' = webview trong app (iPOS); 'out' = mở app/trình duyệt ngoài (Grab/Shopee/Maps). */
function openUrl(url, mode){
  const sdk = window.ZaloMiniAppSDK;
  if(sdk && typeof sdk.openWebview==='function'){
    const onFail=function(e){ toast('Mở lỗi: '+(((e&&(e.message||e.error))||JSON.stringify(e))+'').slice(0,90)); };
    try{
      const p = sdk.openWebview({ url:url, success:function(){}, fail:onFail });
      if(p && typeof p.then==='function') p.then(function(){}, onFail);
      return;
    }catch(e){ toast('SDK lỗi: '+((e&&e.message)||e)); return; }
  }
  window.open(url,'_blank','noopener');   // fallback (trình duyệt/local)
}

let tT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),1900); }

/* ============== MASTER RENDER ============== */
function render(){
  renderHome(); renderMenu(); updateMenuStamp(); updateCartBar();
  $('#home-pts').textContent=state.points.toLocaleString('vi-VN');
  $('#home-rank').textContent=rankOf(state.points).n.replace(/^.*Hạng /,'');
  $('#acc-orders').textContent= state.orderList.length? state.orderList.length+' đơn · gần nhất '+state.orderList[0].no : 'Chưa có đơn nào';
  if($('#v-loyalty').classList.contains('active')) renderLoyalty();
}
